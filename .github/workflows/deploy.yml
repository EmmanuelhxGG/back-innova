name: CI/CD Backend Innovatech

on:
  push:
    branches: [ "deploy" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login en Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build imagen Ventas
        run: |
          docker build -t ${{ secrets.ECR_REPO_URL_VENTAS }}:latest ./back-Ventas_SpringBoot/Springboot-API-REST

      - name: Push imagen Ventas a ECR
        run: |
          docker push ${{ secrets.ECR_REPO_URL_VENTAS }}:latest

      - name: Build imagen Despachos
        run: |
          docker build -t ${{ secrets.ECR_REPO_URL_DESPACHOS }}:latest ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO

      - name: Push imagen Despachos a ECR
        run: |
          docker push ${{ secrets.ECR_REPO_URL_DESPACHOS }}:latest

      - name: Deploy en EC2 Backend via SSM
        run: |
          aws ssm send-command \
            --instance-ids ${{ secrets.EC2_BACKEND_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --region ${{ secrets.AWS_REGION }} \
            --parameters commands="[
              'aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}',
              'docker pull ${{ secrets.ECR_REPO_URL_VENTAS }}:latest',
              'docker pull ${{ secrets.ECR_REPO_URL_DESPACHOS }}:latest',
              'cd /home/ec2-user/backend && docker compose up -d --remove-orphans'
            ]"
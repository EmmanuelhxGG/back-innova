version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: root
    # ❌ ELIMINADO: ports - Base de datos privada, sin acceso externo
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - backend-network

  ventas-api:
    build:
      context: ./back-Ventas_SpringBoot/Springboot-API-REST
      dockerfile: Dockerfile
    container_name: ventas-api
    # ❌ ELIMINADO: ports - Solo accesible desde frontend via Docker network
    environment:
      - DB_ENDPOINT=mysql-db
      - DB_PORT=3306
      - DB_NAME=ventas_db
      - DB_USERNAME=root
      - DB_PASSWORD=root
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - backend-network

  despachos-api:
    build:
      context: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
      dockerfile: Dockerfile
    container_name: despachos-api
    # ❌ ELIMINADO: ports - Solo accesible desde frontend via Docker network
    environment:
      - DB_ENDPOINT=mysql-db
      - DB_PORT=3306
      - DB_NAME=despachos_db
      - DB_USERNAME=root
      - DB_PASSWORD=root
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - backend-network

volumes:
  mysql_data:

networks:
  backend-network:
    driver: bridge
